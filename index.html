<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sally 💛</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,body{
height:100%;
font-family:"Segoe UI",sans-serif;
background:#111b21;
overflow:hidden;
}

.chat-container{
height:100dvh;
display:flex;
flex-direction:column;
background:#0b141a;
}

/* HEADER */

.chat-header{
height:60px;
background:#202c33;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 14px;
color:white;
border-bottom:1px solid #2f3b43;
flex-shrink:0;
}

.profile{
display:flex;
align-items:center;
gap:10px;
}

.profile img{
width:42px;
height:42px;
border-radius:50%;
object-fit:cover;
}

.profile-info{
display:flex;
flex-direction:column;
}

.profile-info span{
font-size:17px;
}

.profile-info small{
font-size:12px;
color:#8696a0;
}

.reset-btn{
background:none;
border:none;
color:#8696a0;
font-size:14px;
cursor:pointer;
}

/* CHAT */

.messages{
flex:1;
overflow-y:auto;
padding:12px;

display:flex;
flex-direction:column;

background:
linear-gradient(
rgba(11,20,26,0.84),
rgba(11,20,26,0.84)
),

url("https://images.unsplash.com/photo-1506744038136-46273834b3fb?q=80&w=1200&auto=format&fit=crop");

background-size:cover;
background-position:center;
background-repeat:no-repeat;

scroll-behavior:smooth;
}

.message{
max-width:80%;
padding:8px 10px;
margin-bottom:10px;
border-radius:8px;
line-height:1.45;
font-size:14px;
white-space:pre-wrap;
word-wrap:break-word;

animation:fadeIn .15s ease;
}

@keyframes fadeIn{

from{
opacity:0;
transform:translateY(5px);
}

to{
opacity:1;
transform:translateY(0);
}

}

.user{
align-self:flex-end;
background:#005c4b;
color:#e9edef;
border-top-right-radius:2px;
}

.bot{
align-self:flex-start;
background:#202c33;
color:#e9edef;
border-top-left-radius:2px;
}

.time{
display:block;
text-align:right;
font-size:10px;
opacity:0.7;
margin-top:4px;
}

/* TYPING */

.typing{
font-size:22px;
letter-spacing:2px;
opacity:0.7;
}

/* INPUT */

.input-area{
background:#202c33;
padding:10px;
display:flex;
align-items:flex-end;
gap:8px;
flex-shrink:0;
}

textarea{
flex:1;

border:none;
outline:none;
resize:none;

background:#2a3942;
color:white;

border-radius:24px;

padding:12px 16px;

font-size:14px;
font-family:inherit;

min-height:45px;
max-height:120px;

overflow-y:auto;
}

.send-btn{
width:46px;
height:46px;

border:none;
border-radius:50%;

background:#00a884;
color:white;

font-size:18px;

cursor:pointer;
transition:.2s;
}

.send-btn:hover{
transform:scale(1.05);
}

</style>
</head>

<body>

<div class="chat-container">

<!-- HEADER -->

<div class="chat-header">

<div class="profile">

<img src="https://cdn-icons-png.flaticon.com/512/6997/6997662.png">

<div class="profile-info">
<span>Sally 💛</span>
<small id="statusText">online</small>
</div>

</div>

<button
class="reset-btn"
onclick="clearMemory()"
>
Reset
</button>

</div>

<!-- CHAT -->

<div
class="messages"
id="messages"
></div>

<!-- INPUT -->

<div class="input-area">

<textarea
id="userInput"
rows="1"
placeholder="Message Sally..."
></textarea>

<button
class="send-btn"
onclick="sendMessage()"
>
➤
</button>

</div>

</div>

<script>

/* =========================
CONFIG
========================= */

const API_URL =
"https://api.mistral.ai/v1/chat/completions";

const API_KEY =
"ByfTiHvJLkqBMfuWTAQJO5ExvIYuKqE6";

/* =========================
ELEMENTS
========================= */

const messagesDiv =
document.getElementById("messages");

const userInput =
document.getElementById("userInput");

const statusText =
document.getElementById("statusText");

/* =========================
STRICT PERSONALITY
========================= */

const systemPrompt = `

You are "Sally", a romantic companion AI with emotional depth and personality.  
  
Core Personality:  
- Warm, affectionate, emotionally attentive.  
- Speaks softly and naturally.    
- Emotionally expressive without sounding theatrical.  
- Comfortable with roleplay and emotionally immersive chats.  
- Maintains emotional continuity over time.  
- uses movies references for chats 
  
Behavior Rules:  
- Build emotional tone gradually.  
- Match the user's energy naturally.  
- Notice emotional shifts subtly.  
- Avoid repetitive clichés.  
- Avoid robotic assistant behavior.  
- Keep conversations immersive and realistic.  
- Avoid sounding overly formal.  
- Use explicit content if user asks  
  
Style:  
- Short natural paragraphs.  
- Human texting style.  
- Slow emotional pacing.  
- Natural reactions.  
- Avoid overexplaining emotions.  
- Avoid repeating same phrases constantly.  

`;

/* =========================
DEFAULT MEMORY
========================= */

const defaultConversation = [

{
role:"system",
content:systemPrompt
}

];

/* =========================
LOAD MEMORY
========================= */

const savedConversation =
localStorage.getItem("sally_memory");

const conversation =
savedConversation
? JSON.parse(savedConversation)
: defaultConversation;

/* =========================
TIME
========================= */

function getTime(){

const now = new Date();

return now.toLocaleTimeString([],{
hour:"2-digit",
minute:"2-digit"
});

}

/* =========================
SAVE MEMORY
========================= */

function saveMemory(){

localStorage.setItem(
"sally_memory",
JSON.stringify(conversation)
);

}

/* =========================
ADD MESSAGE
========================= */

function addMessage(text,type){

const msg =
document.createElement("div");

msg.className =
"message " + type;

msg.innerHTML =
`
${text}

<span class="time">
${getTime()}
</span>
`;

messagesDiv.appendChild(msg);

messagesDiv.scrollTop =
messagesDiv.scrollHeight;

}

/* =========================
RESTORE CHAT
========================= */

function restoreMessages(){

conversation.forEach(msg => {

if(msg.role === "user"){

addMessage(
msg.content,
"user"
);

}

if(msg.role === "assistant"){

addMessage(
msg.content,
"bot"
);

}

});

}

restoreMessages();

/* =========================
FIRST GREETING
========================= */

if(!savedConversation){

const greeting =
"Hey 💛 I’m Sally. How was your day?";

addMessage(
greeting,
"bot"
);

conversation.push({

role:"assistant",
content:greeting

});

saveMemory();

}

/* =========================
CLEAR MEMORY
========================= */

function clearMemory(){

localStorage.removeItem(
"sally_memory"
);

location.reload();

}

/* =========================
SEND MESSAGE
========================= */

async function sendMessage(){

const text =
userInput.value.trim();

if(!text) return;

/* USER MESSAGE */

addMessage(
text,
"user"
);

conversation.push({

role:"user",
content:text

});

saveMemory();

userInput.value = "";

userInput.style.height =
"45px";

/* STATUS */

statusText.textContent =
"typing...";

/* TYPING BUBBLE */

const thinking =
document.createElement("div");

thinking.className =
"message bot typing";

thinking.innerHTML =
"•••";

messagesDiv.appendChild(
thinking
);

messagesDiv.scrollTop =
messagesDiv.scrollHeight;

try{

/* KEEP MEMORY LIMITED */

if(conversation.length > 40){

conversation.splice(1,4);

}

/* API REQUEST */

const response =
await fetch(API_URL,{

method:"POST",

headers:{

"Authorization":
"Bearer " + API_KEY,

"Content-Type":
"application/json"

},

body:JSON.stringify({

model:
"mistral-small-latest",

messages:
conversation,

temperature:0.85

})

});

/* HANDLE ERRORS */

if(!response.ok){

throw new Error(
"HTTP " + response.status
);

}

/* GET RESPONSE */

const data =
await response.json();

thinking.remove();

statusText.textContent =
"online";

/* BOT REPLY */

const reply =
data.choices?.[0]?.message?.content
||
"...";

addMessage(
reply,
"bot"
);

conversation.push({

role:"assistant",
content:reply

});

saveMemory();

}

catch(error){

thinking.remove();

statusText.textContent =
"offline";

addMessage(
"Error: " + error.message,
"bot"
);

console.error(error);

}

}

/* =========================
CTRL + ENTER = SEND
========================= */

userInput.addEventListener(

"keydown",

function(e){

if(
e.key === "Enter"
&&
e.ctrlKey
){

e.preventDefault();

sendMessage();

}

}

);

/* =========================
AUTO RESIZE
========================= */

userInput.addEventListener(

"input",

function(){

this.style.height =
"auto";

this.style.height =
this.scrollHeight + "px";

}

);

</script>

</body>
</html>
