<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sally 💛</title>

  <style>
    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      font-family:"Segoe UI",sans-serif;
      background:#111b21;
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
    }

    .chat-container{
      width:100%;
      max-width:420px;
      height:100vh;
      background:#0b141a;
      display:flex;
      flex-direction:column;
      overflow:hidden;
      position:relative;
    }

    /* HEADER */

    .chat-header{
      height:60px;
      background:#202c33;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 14px;
      border-bottom:1px solid #2f3b43;
      color:white;
    }

    .profile{
      display:flex;
      align-items:center;
      gap:10px;
    }

    .profile img{
      width:40px;
      height:40px;
      border-radius:50%;
      object-fit:cover;
    }

    .profile-info{
      display:flex;
      flex-direction:column;
    }

    .profile-info small{
      color:#8696a0;
      font-size:12px;
    }

    .reset-btn{
      background:transparent;
      border:none;
      color:#8696a0;
      cursor:pointer;
      font-size:13px;
    }

    .reset-btn:hover{
      color:white;
    }

    /* MESSAGES */

    .messages{
      flex:1;
      overflow-y:auto;
      padding:12px;
      display:flex;
      flex-direction:column;
      background:#0b141a;
      background-image:url("https://i.imgur.com/3QZQZ9P.png");
      background-size:cover;
      scroll-behavior:smooth;
    }

    .message{
      max-width:78%;
      padding:8px 10px;
      margin-bottom:10px;
      border-radius:8px;
      line-height:1.4;
      font-size:14px;
      word-wrap:break-word;
      white-space:pre-wrap;
      position:relative;
      animation:fadeIn .2s ease;
    }

    @keyframes fadeIn{
      from{
        opacity:0;
        transform:translateY(5px);
      }
      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    .user{
      align-self:flex-end;
      background:#005c4b;
      color:#e9edef;
      border-top-right-radius:2px;
    }

    .bot{
      align-self:flex-start;
      background:#202c33;
      color:#e9edef;
      border-top-left-radius:2px;
    }

    .typing{
      font-size:20px;
      opacity:0.7;
      letter-spacing:2px;
    }

    .time{
      display:block;
      text-align:right;
      font-size:10px;
      opacity:0.7;
      margin-top:4px;
    }

    /* INPUT */

    .input-area{
      display:flex;
      align-items:flex-end;
      gap:8px;
      padding:10px;
      background:#202c33;
    }

    textarea{
      flex:1;
      resize:none;
      border:none;
      outline:none;
      border-radius:22px;
      padding:12px 16px;
      background:#2a3942;
      color:white;
      font-size:14px;
      min-height:45px;
      max-height:120px;
      overflow-y:auto;
      font-family:inherit;
    }

    .send-btn{
      width:45px;
      height:45px;
      border:none;
      border-radius:50%;
      background:#00a884;
      color:white;
      font-size:18px;
      cursor:pointer;
      transition:0.2s;
    }

    .send-btn:hover{
      background:#06cf9c;
    }

    @media (max-width:600px){
      .chat-container{
        max-width:none;
      }
    }
  </style>
</head>

<body>

<div class="chat-container">

  <!-- HEADER -->

  <div class="chat-header">

    <div class="profile">

      <img src="https://i.imgur.com/Z6XQw5x.png">

      <div class="profile-info">
        <span>Sally 💛</span>
        <small id="statusText">online</small>
      </div>

    </div>

    <button class="reset-btn" onclick="clearMemory()">
      Reset
    </button>

  </div>

  <!-- MESSAGES -->

  <div class="messages" id="messages"></div>

  <!-- INPUT -->

  <div class="input-area">

    <textarea
      id="userInput"
      rows="1"
      placeholder="Message Sally..."
    ></textarea>

    <button class="send-btn" onclick="sendMessage()">
      ➤
    </button>

  </div>

</div>

<script>

  // =========================
  // CONFIG
  // =========================

  const API_URL =
    "https://api.mistral.ai/v1/chat/completions";

  // ⚠ PUT YOUR API KEY HERE
  const API_KEY =
    "QBAOi3QEWO5MmQm619QawrcAH9Zq7UkI";

  const messagesDiv =
    document.getElementById("messages");

  const userInput =
    document.getElementById("userInput");

  const statusText =
    document.getElementById("statusText");

  // =========================
  // DEFAULT MEMORY
  // =========================

  const defaultConversation = [

    {
      role:"system",

      content:`
You are Sally.

You are emotionally warm, calm, natural, and human-like.

Rules:
- Speak naturally.
- Avoid sounding robotic.
- Avoid overly dramatic romance.
- Be emotionally attentive.
- Keep responses immersive but realistic.
- Avoid explicit sexual content.
- Match the user's tone and energy.
- Occasionally tease gently.
- Keep responses concise.
`
    }

  ];

  // =========================
  // LOAD MEMORY
  // =========================

  const savedConversation =
    localStorage.getItem("sally_memory");

  const conversation =
    savedConversation
      ? JSON.parse(savedConversation)
      : defaultConversation;

  // =========================
  // TIME FUNCTION
  // =========================

  function getTime(){

    const now = new Date();

    return now.toLocaleTimeString([],{
      hour:"2-digit",
      minute:"2-digit"
    });

  }

  // =========================
  // ADD MESSAGE
  // =========================

  function addMessage(text,type){

    const msg =
      document.createElement("div");

    msg.className =
      "message " + type;

    msg.innerHTML =
      `
      ${text}
      <span class="time">${getTime()}</span>
      `;

    messagesDiv.appendChild(msg);

    messagesDiv.scrollTop =
      messagesDiv.scrollHeight;
  }

  // =========================
  // RESTORE OLD CHAT
  // =========================

  function restoreMessages(){

    conversation.forEach(msg => {

      if(msg.role === "user"){

        addMessage(
          msg.content,
          "user"
        );

      }

      if(msg.role === "assistant"){

        addMessage(
          msg.content,
          "bot"
        );

      }

    });

  }

  restoreMessages();

  // =========================
  // FIRST GREETING
  // =========================

  if(!savedConversation){

    const greeting =
      "Hey 💛 I’m Sally. Tell me how your day’s been.";

    addMessage(greeting,"bot");

    conversation.push({
      role:"assistant",
      content:greeting
    });

    saveMemory();

  }

  // =========================
  // SAVE MEMORY
  // =========================

  function saveMemory(){

    localStorage.setItem(
      "sally_memory",
      JSON.stringify(conversation)
    );

  }

  // =========================
  // CLEAR MEMORY
  // =========================

  function clearMemory(){

    const confirmReset =
      confirm(
        "Delete all messages?"
      );

    if(!confirmReset) return;

    localStorage.removeItem(
      "sally_memory"
    );

    location.reload();

  }

  // =========================
  // SEND MESSAGE
  // =========================

  async function sendMessage(){

    const text =
      userInput.value.trim();

    if(!text) return;

    // show user msg

    addMessage(text,"user");

    conversation.push({
      role:"user",
      content:text
    });

    saveMemory();

    userInput.value = "";
    userInput.style.height = "45px";

    // fake typing

    statusText.textContent =
      "typing...";

    const thinking =
      document.createElement("div");

    thinking.className =
      "message bot typing";

    thinking.innerHTML =
      "•••";

    messagesDiv.appendChild(thinking);

    messagesDiv.scrollTop =
      messagesDiv.scrollHeight;

    try{

      // trim memory

      if(conversation.length > 40){

        conversation.splice(1,2);

      }

      const response =
        await fetch(API_URL,{

          method:"POST",

          headers:{
            "Authorization":
              "Bearer " + API_KEY,

            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({

            model:
              "mistral-large-latest",

            messages:
              conversation

          })

        });

      const data =
        await response.json();

      thinking.remove();

      statusText.textContent =
        "online";

      const reply =
        data.choices?.[0]?.message?.content
        ||
        "Something interrupted my thoughts...";

      addMessage(reply,"bot");

      conversation.push({
        role:"assistant",
        content:reply
      });

      saveMemory();

    }

    catch(error){

      thinking.remove();

      statusText.textContent =
        "online";

      addMessage(
        "Connection issue or invalid API key.",
        "bot"
      );

      console.error(error);

    }

  }

  // =========================
  // CTRL + ENTER = SEND
  // =========================

  userInput.addEventListener(
    "keydown",

    function(e){

      if(
        e.key === "Enter"
        &&
        e.ctrlKey
      ){

        e.preventDefault();

        sendMessage();

      }

    }

  );

  // =========================
  // AUTO RESIZE TEXTAREA
  // =========================

  userInput.addEventListener(
    "input",

    function(){

      this.style.height =
        "auto";

      this.style.height =
        this.scrollHeight + "px";

    }

  );

</script>

</body>
  </html>
